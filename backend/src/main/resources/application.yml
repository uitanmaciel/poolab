spring:
  config:
    # Carrega o .env local (fora do git). Variaveis de ambiente reais tem prioridade.
    import: optional:file:.env[.properties]
  application:
    name: agenda
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION:86400}
  demo:
    password: ${DEMO_PASSWORD}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
